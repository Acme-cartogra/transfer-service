name: Cartogra contract check
on: pull_request
jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: allanweber/cartogra-contract-check@v1
        with:
          api-key: ${{ secrets.CARTOGRA_API_KEY }}
          service: transfer-service
          spec: openapi.yaml
